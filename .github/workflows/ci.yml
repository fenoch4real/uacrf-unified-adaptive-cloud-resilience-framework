name: UACRF CI & SSDF Supply-Chain Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  verify-ontology-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Neo4j ontology counts & JSON validity
        run: |
          node -e "
          const fs = require('fs');
          const cat = JSON.parse(fs.readFileSync('contracts/neo4j/ontology_catalog.json', 'utf8'));
          if (cat.nodeLabels.length !== 58 || cat.relationshipTypes.length !== 55) {
            throw new Error('Ontology mismatch: ' + cat.nodeLabels.length + ' / ' + cat.relationshipTypes.length);
          }
          console.log('Verified 58 Neo4j node labels and 55 relationship types');
          "

  secret-and-iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy Filesystem & IaC Misconfiguration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  codeql-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile for CodeQL SAST
        run: mvn -B test-compile -DskipTests
      - uses: github/codeql-action/analyze@v4
        with:
          output: target/codeql-sarif
          upload: never
      - name: Upload CodeQL SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uacrf-codeql-sarif
          path: target/codeql-sarif

  maven-build-verify-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify all Maven modules (with Testcontainers)
        run: mvn -B verify
      - name: Generate CycloneDX SBOM (SSDF / EO 14028)
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.8.2:makeAggregateBom
      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uacrf-cyclonedx-sbom
          path: target/bom.*
      - name: Install Cosign for keyless artifact attestation
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.7.0
      - name: Collect SOC 2 technical evidence bundle
        run: bash infra/scripts/collect-soc2-evidence.sh
