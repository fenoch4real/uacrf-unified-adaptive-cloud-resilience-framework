    image: postgres@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: ${KNOWLEDGE_DB_NAME:?copy .env.example to .env and configure it}
      POSTGRES_USER: ${KNOWLEDGE_DB_ADMIN_USER:?set a knowledge database admin user}
      POSTGRES_PASSWORD: ${KNOWLEDGE_DB_ADMIN_PASSWORD:?set a knowledge database admin password}
      APP_DB_USER: ${KNOWLEDGE_DB_USER:?copy .env.example to .env and configure it}
