    volumes:
      - knowledge-data:/var/lib/postgresql/data
      - ./config/postgres/10-restrict-application-role.sql:/docker-entrypoint-initdb.d/10-restrict-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: ${TOPOLOGY_NEO4J_USER:-neo4j}/${TOPOLOGY_NEO4J_PASSWORD:?set a topology Neo4j password}
      TOPOLOGY_NEO4J_USER: ${TOPOLOGY_NEO4J_USER:-neo4j}
      TOPOLOGY_NEO4J_PASSWORD: ${TOPOLOGY_NEO4J_PASSWORD:?set a topology Neo4j password}
    ports:
      - "127.0.0.1:55687:7687"
    volumes:
      - topology-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${TOPOLOGY_NEO4J_USER}\" -p \"$${TOPOLOGY_NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set a local Keycloak admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set a local Keycloak admin password}
      KC_HOSTNAME: http://localhost:8180
      KEYCLOAK_LOCAL_ADMIN_PASSWORD: ${KEYCLOAK_LOCAL_ADMIN_PASSWORD:?set a local UACRF admin password}
      KEYCLOAK_DIRECTORY_CLIENT_SECRET: ${KEYCLOAK_DIRECTORY_CLIENT_SECRET:?set the identity directory client secret}
      KEYCLOAK_S03_PUBLISHER_CLIENT_SECRET: ${KEYCLOAK_S03_PUBLISHER_CLIENT_SECRET:?set the S03 publisher client secret}
      KEYCLOAK_S07_EVALUATOR_CLIENT_SECRET: ${KEYCLOAK_S07_EVALUATOR_CLIENT_SECRET:?set the S07 evaluator client secret}
      KEYCLOAK_S08_RETRIEVER_CLIENT_SECRET: ${KEYCLOAK_S08_RETRIEVER_CLIENT_SECRET:?set the S08 retriever client secret}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./config/keycloak/uacrf-realm.json:/opt/keycloak/data/import/uacrf-realm.json:ro

volumes:
  identity-data:
  catalog-data:
  connections-data:
  evidence-data:
  objectives-data:
  topology-data:
  topology-neo4j-data:
  assessment-data:
  knowledge-data:
  keycloak-data:
