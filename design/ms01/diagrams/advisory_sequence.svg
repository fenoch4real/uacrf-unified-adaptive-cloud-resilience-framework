<rect x="567.5" y="556" width="300" height="80" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="579.5" y="577" font-size="19" fill="#152b43">6 Journal intent before model</text>
<text x="579.5" y="601" font-size="19" fill="#152b43">invocation</text>
<path d="M707.5,703 L292.5,703" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
