<text x="300.5" y="915" font-size="19" fill="#152b43">10 Retain advisory review and rationale</text>
<text x="35" y="993" font-size="19" fill="#152b43">Unknown model usage stays null. Missing or abstaining roles block; dissent is</text>
<text x="35" y="1017" font-size="19" fill="#152b43">preserved. Cancellation retains late ineligible output.</text>
