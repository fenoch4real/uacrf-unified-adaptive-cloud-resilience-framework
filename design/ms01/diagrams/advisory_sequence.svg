<text x="93.0" y="150" font-size="19" fill="#152b43">1 Choose fixed case</text>
<text x="93.0" y="174" font-size="19" fill="#152b43">guidance and roles</text>
<path d="M292.5,287 L500.0,287" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="227" font-size="19" fill="#152b43">2 Verify active</text>
<text x="300.5" y="251" font-size="19" fill="#152b43">profiles and same-</text>
<text x="300.5" y="275" font-size="19" fill="#152b43">purpose sources</text>
