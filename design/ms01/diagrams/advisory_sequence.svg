<text x="300.5" y="237" font-size="19" fill="#152b43">2 Verify active</text>
<text x="300.5" y="261" font-size="19" fill="#152b43">profiles and same-</text>
<text x="300.5" y="285" font-size="19" fill="#152b43">purpose sources</text>
