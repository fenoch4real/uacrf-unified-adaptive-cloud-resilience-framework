<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1052" viewBox="0 0 1000 1052" role="img" aria-label="Bounded advisory agent workflow"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
