<text x="164.5" y="349" font-size="19" fill="#152b43">3 Reserve one attempt per</text>
<text x="164.5" y="373" font-size="19" fill="#152b43">required role</text>
<path d="M707.5,475 L292.5,475" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="450" font-size="19" fill="#152b43">4 Claim only assigned input once</text>
<path d="M292.5,538 L707.5,538" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
