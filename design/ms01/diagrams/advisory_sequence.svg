<text x="164.5" y="305" font-size="19" fill="#152b43">3 Reserve one attempt per</text>
<text x="164.5" y="329" font-size="19" fill="#152b43">required role</text>
<path d="M707.5,441 L292.5,441" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="381" font-size="19" fill="#152b43">4 Claim only assigned input once</text>
<path d="M292.5,518 L707.5,518" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="458" font-size="19" fill="#152b43">5 Issue exact verified bounded packet</text>
<rect x="567.5" y="515" width="300" height="70" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="579.5" y="536" font-size="19" fill="#152b43">6 Journal intent before model</text>
<text x="579.5" y="560" font-size="19" fill="#152b43">invocation</text>
<path d="M707.5,672 L292.5,672" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="612" font-size="19" fill="#152b43">7 Submit output and every dissent record</text>
<path d="M915.0,749 L292.5,749" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
