<text x="300.5" y="790" font-size="19" fill="#152b43">source and actual</text>
<text x="300.5" y="814" font-size="19" fill="#152b43">files</text>
<path d="M292.5,903 L915.0,903" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="843" font-size="19" fill="#152b43">10 Retain advisory review and rationale</text>
<text x="35" y="970" font-size="19" fill="#152b43">Unknown model usage stays null. Missing or abstaining roles block; dissent is</text>
<text x="35" y="994" font-size="19" fill="#152b43">preserved. Cancellation retains late ineligible output.</text>
