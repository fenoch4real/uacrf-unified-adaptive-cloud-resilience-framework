<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="896" viewBox="0 0 1000 896" role="img" aria-label="Transactional event delivery"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
<text x="35" y="44" font-size="28" font-weight="700">Transactional event delivery</text>
<text x="10.0" y="85" font-size="19" fill="#152b43">Producer</text>
<line x1="85.0" y1="120" x2="85.0" y2="812" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="217.5" y="85" font-size="19" fill="#152b43">Owner DB</text>
<line x1="292.5" y1="120" x2="292.5" y2="812" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="425.0" y="85" font-size="19" fill="#152b43">Kafka</text>
<line x1="500.0" y1="120" x2="500.0" y2="812" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="632.5" y="85" font-size="19" fill="#152b43">Consumer</text>
<line x1="707.5" y1="120" x2="707.5" y2="812" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="840.0" y="85" font-size="19" fill="#152b43">Consumer DB</text>
<line x1="915.0" y1="120" x2="915.0" y2="812" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<path d="M85.0,223 L292.5,223" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="150" font-size="19" fill="#152b43">1 Commit business</text>
<text x="93.0" y="174" font-size="19" fill="#152b43">change audit and</text>
<text x="93.0" y="198" font-size="19" fill="#152b43">outbox</text>
<path d="M292.5,310 L85.0,310" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="261" font-size="19" fill="#152b43">2 Return durable</text>
<text x="93.0" y="285" font-size="19" fill="#152b43">owner result</text>
<path d="M85.0,373 L500.0,373" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="348" font-size="19" fill="#152b43">3 Publish leased outbox event</text>
<path d="M500.0,436 L85.0,436" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="411" font-size="19" fill="#152b43">4 Acknowledge publication</text>
<path d="M500.0,523 L707.5,523" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="508.0" y="474" font-size="19" fill="#152b43">5 Deliver event at</text>
<text x="508.0" y="498" font-size="19" fill="#152b43">least once</text>
<path d="M707.5,610 L915.0,610" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715.5" y="561" font-size="19" fill="#152b43">6 Commit inbox key</text>
<text x="715.5" y="585" font-size="19" fill="#152b43">and local projection</text>
<path d="M915.0,697 L707.5,697" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715.5" y="648" font-size="19" fill="#152b43">7 Return committed</text>
<text x="715.5" y="672" font-size="19" fill="#152b43">consumer result</text>
<path d="M707.5,784 L500.0,784" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="508.0" y="735" font-size="19" fill="#152b43">8 Acknowledge after</text>
<text x="508.0" y="759" font-size="19" fill="#152b43">local commit</text>
<text x="35" y="837" font-size="19" fill="#152b43">Crash after publish can duplicate delivery. Inbox deduplication handles it; conflicts</text>
<text x="35" y="861" font-size="19" fill="#152b43">are quarantined, not silently overwritten.</text>
</g></svg>