<path d="M85.0,220 L251.0,220" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="150" font-size="19" fill="#152b43">1 Request exact</text>
<text x="93.0" y="174" font-size="19" fill="#152b43">plan and context</text>
<path d="M251.0,310 L417.0,310" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="259.0" y="240" font-size="19" fill="#152b43">2 Read current</text>
<text x="259.0" y="264" font-size="19" fill="#152b43">source and access</text>
<text x="259.0" y="288" font-size="19" fill="#152b43">receipts</text>
<path d="M417.0,400 L251.0,400" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="259.0" y="330" font-size="19" fill="#152b43">3 Return bounded</text>
<text x="259.0" y="354" font-size="19" fill="#152b43">current owner</text>
<text x="259.0" y="378" font-size="19" fill="#152b43">facts</text>
<path d="M251.0,490 L85.0,490" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="420" font-size="19" fill="#152b43">4 Reserve one</text>
<text x="93.0" y="444" font-size="19" fill="#152b43">bound attempt</text>
<path d="M85.0,580 L583.0,580" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="510" font-size="19" fill="#152b43">5 Deliver plan and reservation</text>
<path d="M583.0,670 L251.0,670" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="259.0" y="600" font-size="19" fill="#152b43">6 Current permit and fence check</text>
<path d="M583.0,760 L749.0,760" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591.0" y="690" font-size="19" fill="#152b43">7 Check provider</text>
<text x="591.0" y="714" font-size="19" fill="#152b43">preconditions</text>
<rect x="443.0" y="760" width="300" height="70" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="455.0" y="781" font-size="19" fill="#152b43">8 Persist DISPATCHING attempt</text>
<path d="M583.0,940 L749.0,940" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591.0" y="870" font-size="19" fill="#152b43">9 Dispatch</text>
<text x="591.0" y="894" font-size="19" fill="#152b43">conditional</text>
<text x="591.0" y="918" font-size="19" fill="#152b43">request</text>
<path d="M749.0,1030 L583.0,1030" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591.0" y="960" font-size="19" fill="#152b43">10 Return</text>
<text x="591.0" y="984" font-size="19" fill="#152b43">observed effect</text>
<text x="591.0" y="1008" font-size="19" fill="#152b43">or uncertainty</text>
<path d="M583.0,1120 L85.0,1120" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1050" font-size="19" fill="#152b43">11 Retain outcome and request identity</text>
<path d="M85.0,1210 L915.0,1210" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1140" font-size="19" fill="#152b43">12 Request independent mandatory probes</text>
<path d="M915.0,1300 L85.0,1300" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1230" font-size="19" fill="#152b43">13 Return observed validation evidence</text>
<path d="M85.0,1390 L251.0,1390" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1320" font-size="19" fill="#152b43">14 Retain final</text>
<text x="93.0" y="1344" font-size="19" fill="#152b43">justified</text>
<text x="93.0" y="1368" font-size="19" fill="#152b43">disposition</text>
<text x="35" y="1460" font-size="19" fill="#152b43">Denied, stale or unavailable current authority stops new dispatch. A lost provider</text>
<text x="35" y="1484" font-size="19" fill="#152b43">response stays Unknown until reconciliation.</text>
</g></svg>