<path d="M85.0,199 L251.0,199" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="150" font-size="19" fill="#152b43">1 Request exact</text>
<text x="93.0" y="174" font-size="19" fill="#152b43">plan and context</text>
<path d="M251.0,310 L417.0,310" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="259.0" y="237" font-size="19" fill="#152b43">2 Read current</text>
<text x="259.0" y="261" font-size="19" fill="#152b43">source and access</text>
<text x="259.0" y="285" font-size="19" fill="#152b43">receipts</text>
<path d="M417.0,421 L251.0,421" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="259.0" y="348" font-size="19" fill="#152b43">3 Return bounded</text>
<text x="259.0" y="372" font-size="19" fill="#152b43">current owner</text>
<text x="259.0" y="396" font-size="19" fill="#152b43">facts</text>
<path d="M251.0,508 L85.0,508" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="459" font-size="19" fill="#152b43">4 Reserve one</text>
<text x="93.0" y="483" font-size="19" fill="#152b43">bound attempt</text>
<path d="M85.0,571 L583.0,571" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="546" font-size="19" fill="#152b43">5 Deliver plan and reservation</text>
<path d="M583.0,634 L251.0,634" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="259.0" y="609" font-size="19" fill="#152b43">6 Current permit and fence check</text>
<path d="M583.0,721 L749.0,721" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591.0" y="672" font-size="19" fill="#152b43">7 Check provider</text>
<text x="591.0" y="696" font-size="19" fill="#152b43">preconditions</text>
<rect x="443.0" y="739" width="300" height="70" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="455.0" y="760" font-size="19" fill="#152b43">8 Persist DISPATCHING attempt</text>
<path d="M583.0,924 L749.0,924" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591.0" y="851" font-size="19" fill="#152b43">9 Dispatch</text>
<text x="591.0" y="875" font-size="19" fill="#152b43">conditional</text>
<text x="591.0" y="899" font-size="19" fill="#152b43">request</text>
<path d="M749.0,1035 L583.0,1035" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591.0" y="962" font-size="19" fill="#152b43">10 Return</text>
<text x="591.0" y="986" font-size="19" fill="#152b43">observed effect</text>
<text x="591.0" y="1010" font-size="19" fill="#152b43">or uncertainty</text>
<path d="M583.0,1098 L85.0,1098" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1073" font-size="19" fill="#152b43">11 Retain outcome and request identity</text>
<path d="M85.0,1161 L915.0,1161" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1136" font-size="19" fill="#152b43">12 Request independent mandatory probes</text>
<path d="M915.0,1224 L85.0,1224" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1199" font-size="19" fill="#152b43">13 Return observed validation evidence</text>
<path d="M85.0,1335 L251.0,1335" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="1262" font-size="19" fill="#152b43">14 Retain final</text>
<text x="93.0" y="1286" font-size="19" fill="#152b43">justified</text>
<text x="93.0" y="1310" font-size="19" fill="#152b43">disposition</text>
<text x="35" y="1388" font-size="19" fill="#152b43">Denied, stale or unavailable current authority stops new dispatch. A lost provider</text>
<text x="35" y="1412" font-size="19" fill="#152b43">response stays Unknown until reconciliation.</text>
</g></svg>