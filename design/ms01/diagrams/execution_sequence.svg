<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1447" viewBox="0 0 1000 1447" role="img" aria-label="Authorized execution and independent validation"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
<text x="35" y="44" font-size="28" font-weight="700">Authorized execution and independent validation</text>
