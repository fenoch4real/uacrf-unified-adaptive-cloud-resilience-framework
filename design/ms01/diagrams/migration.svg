<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="872" viewBox="0 0 1000 872" role="img" aria-label="One owner migration procedure"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
<text x="35" y="44" font-size="28" font-weight="700">One owner migration procedure</text>
<text x="10.0" y="85" font-size="19" fill="#152b43">Old owner</text>
<line x1="85.0" y1="120" x2="85.0" y2="788" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="286.6666666666667" y="85" font-size="19" fill="#152b43">Migration</text>
<line x1="361.6666666666667" y1="120" x2="361.6666666666667" y2="788" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="563.3333333333334" y="85" font-size="19" fill="#152b43">New owner</text>
<line x1="638.3333333333334" y1="120" x2="638.3333333333334" y2="788" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="840.0" y="85" font-size="19" fill="#152b43">Route edge</text>
<line x1="915.0" y1="120" x2="915.0" y2="788" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<path d="M85.0,199 L361.6666666666667,199" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="150" font-size="19" fill="#152b43">1 Freeze scope and retain</text>
<text x="93.0" y="174" font-size="19" fill="#152b43">baseline hashes</text>
<path d="M361.6666666666667,286 L638.3333333333334,286" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="369.6666666666667" y="237" font-size="19" fill="#152b43">2 Deploy read-only and</text>
<text x="369.6666666666667" y="261" font-size="19" fill="#152b43">compare responses</text>
<path d="M361.6666666666667,373 L85.0,373" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="324" font-size="19" fill="#152b43">3 Stop new writes and fence</text>
<text x="93.0" y="348" font-size="19" fill="#152b43">old workers</text>
<path d="M85.0,436 L638.3333333333334,436" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="411" font-size="19" fill="#152b43">4 Snapshot and replay to accepted watermark</text>
<path d="M361.6666666666667,523 L638.3333333333334,523" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="369.6666666666667" y="474" font-size="19" fill="#152b43">5 Reconcile rows digests</text>
<text x="369.6666666666667" y="498" font-size="19" fill="#152b43">artifacts and events</text>
<path d="M361.6666666666667,586 L915.0,586" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="369.6666666666667" y="561" font-size="19" fill="#152b43">6 Switch one route ownership epoch</text>
<path d="M915.0,673 L638.3333333333334,673" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="646.3333333333334" y="624" font-size="19" fill="#152b43">7 Allow only new owner</text>
<text x="646.3333333333334" y="648" font-size="19" fill="#152b43">writes</text>
<path d="M361.6666666666667,760 L638.3333333333334,760" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="369.6666666666667" y="711" font-size="19" fill="#152b43">8 Verify UI and repair or</text>
<text x="369.6666666666667" y="735" font-size="19" fill="#152b43">finalize cutover</text>
<text x="35" y="813" font-size="19" fill="#152b43">After accepted new writes, rollback needs reconciled reverse migration or forward</text>
<text x="35" y="837" font-size="19" fill="#152b43">repair. Routing alone cannot restore lost facts.</text>
</g></svg>