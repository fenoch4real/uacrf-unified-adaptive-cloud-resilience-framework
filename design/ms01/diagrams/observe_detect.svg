<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="956" viewBox="0 0 1000 956" role="img" aria-label="Observe detect and retain findings"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
<text x="35" y="44" font-size="28" font-weight="700">Observe detect and retain findings</text>
<text x="10.0" y="85" font-size="19" fill="#152b43">Source S03</text>
<line x1="85.0" y1="120" x2="85.0" y2="872" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="217.5" y="85" font-size="19" fill="#152b43">Evidence S04</text>
<line x1="292.5" y1="120" x2="292.5" y2="872" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="425.0" y="85" font-size="19" fill="#152b43">Objectives S05</text>
<line x1="500.0" y1="120" x2="500.0" y2="872" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="632.5" y="85" font-size="19" fill="#152b43">Topology S06</text>
<line x1="707.5" y1="120" x2="707.5" y2="872" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<text x="840.0" y="85" font-size="19" fill="#152b43">Assessment S07</text>
<line x1="915.0" y1="120" x2="915.0" y2="872" stroke="#c2cfdb" stroke-dasharray="5 5"/>
<path d="M85.0,199 L292.5,199" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="93.0" y="150" font-size="19" fill="#152b43">1 Submit observation</text>
<text x="93.0" y="174" font-size="19" fill="#152b43">with source time</text>
<rect x="152.5" y="217" width="300" height="80" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="164.5" y="238" font-size="19" fill="#152b43">2 Verify bytes and qualify</text>
<text x="164.5" y="262" font-size="19" fill="#152b43">under exact policy</text>
<path d="M292.5,364 L915.0,364" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.5" y="339" font-size="19" fill="#152b43">3 Publish qualified observation trigger</text>
<path d="M915.0,427 L500.0,427" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="508.0" y="402" font-size="19" fill="#152b43">4 Read current approved target set</text>
<path d="M915.0,538 L707.5,538" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715.5" y="465" font-size="19" fill="#152b43">5 Read exact</text>
<text x="715.5" y="489" font-size="19" fill="#152b43">accepted graph</text>
<text x="715.5" y="513" font-size="19" fill="#152b43">receipt</text>
<rect x="675" y="556" width="300" height="80" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="687" y="577" font-size="19" fill="#152b43">6 Reverify required artifacts</text>
<text x="687" y="601" font-size="19" fill="#152b43">and seal case</text>
<rect x="675" y="658" width="300" height="80" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="687" y="679" font-size="19" fill="#152b43">7 Compare exact measurements</text>
<text x="687" y="703" font-size="19" fill="#152b43">and targets</text>
<rect x="675" y="760" width="300" height="80" rx="8" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="687" y="781" font-size="19" fill="#152b43">8 Retain findings and</text>
<text x="687" y="805" font-size="19" fill="#152b43">advisory recommendations</text>
<text x="35" y="897" font-size="19" fill="#152b43">Late arrival cannot refresh old measurements. Missing or stale input remains Unknown; a</text>
<text x="35" y="921" font-size="19" fill="#152b43">risk classifier is not a forecast.</text>
</g></svg>