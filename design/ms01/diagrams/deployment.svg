<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-label="Deployment and privilege boundaries"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
<text x="35" y="44" font-size="28" font-weight="700">Deployment and privilege boundaries</text>
<rect x="35" y="90" width="930" height="112" rx="10" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="50" y="118" font-size="20" fill="#152b43">Ingress and experience</text>
<text x="50" y="147" font-size="18" fill="#152b43">Browser -&gt; EDGE01 -&gt; UX01 -&gt; authenticated domain APIs</text>
<rect x="35" y="230" width="930" height="112" rx="10" fill="#fff" stroke="#bbcad9"/>
<text x="50" y="258" font-size="20" fill="#152b43">Control plane service pools</text>
<text x="50" y="287" font-size="18" fill="#152b43">S01 through S10 and S12 through S14; separate identities and databases</text>
<rect x="35" y="370" width="930" height="112" rx="10" fill="#fff" stroke="#bbcad9"/>
<text x="50" y="398" font-size="20" fill="#152b43">Collection and model worker pools</text>
<text x="50" y="427" font-size="18" fill="#152b43">S03 read-only source adapters; S09 bounded advisory model clients</text>
<rect x="35" y="510" width="930" height="112" rx="10" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="50" y="538" font-size="20" fill="#152b43">Tenant isolated execution cells</text>
<text x="50" y="567" font-size="18" fill="#152b43">S11 uses action-specific permits and short-lived target credentials</text>
<rect x="35" y="650" width="930" height="112" rx="10" fill="#fff" stroke="#bbcad9"/>
<text x="50" y="678" font-size="20" fill="#152b43">Managed state and independent operations</text>
<text x="50" y="707" font-size="18" fill="#152b43">Owned PostgreSQL databases, private Neo4j, Kafka, object storage, secret store and telemetry</text>
</g></svg>