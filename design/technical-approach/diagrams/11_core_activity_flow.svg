<svg xmlns="http://www.w3.org/2000/svg" width="2720" height="1500" viewBox="0 0 2720 1500"><rect width="100%" height="100%" fill="white"/><text x="1360.0" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#163A5F">UACRF Core End to End Activity Flow</text><text x="270" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Observe and qualify</text><rect x="60" y="140" width="420" height="105" rx="16" fill="#D9EAF7" stroke="#6B7785" stroke-width="3"/><text x="270" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">1 Ingest</text><text x="270" y="207" text-anchor="middle" font-family="Arial" font-size="15">Receive provider telemetry inventory change security and AI signals</text><rect x="60" y="285" width="420" height="105" rx="16" fill="#D9EAF7" stroke="#6B7785" stroke-width="3"/><text x="270" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">2 Normalize</text><text x="270" y="352" text-anchor="middle" font-family="Arial" font-size="15">Create canonical evidence envelope</text><rect x="60" y="430" width="420" height="105" rx="16" fill="#D9EAF7" stroke="#6B7785" stroke-width="3"/><text x="270" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">3 Qualify</text><text x="270" y="497" text-anchor="middle" font-family="Arial" font-size="15">Validate schema identity freshness integrity provenance and contradiction</text><text x="790" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Project and assess</text><rect x="580" y="140" width="420" height="105" rx="16" fill="#E2F0D9" stroke="#6B7785" stroke-width="3"/><text x="790" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">4 Project</text><text x="790" y="207" text-anchor="middle" font-family="Arial" font-size="15">Idempotently reconcile qualified state into Neo4j</text><rect x="580" y="285" width="420" height="105" rx="16" fill="#E2F0D9" stroke="#6B7785" stroke-width="3"/><text x="790" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">5 Bind revision</text><text x="790" y="352" text-anchor="middle" font-family="Arial" font-size="15">Seal action relevant subgraph and digest</text><rect x="580" y="430" width="420" height="105" rx="16" fill="#E2F0D9" stroke="#6B7785" stroke-width="3"/><text x="790" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">6 Assess</text><text x="790" y="497" text-anchor="middle" font-family="Arial" font-size="15">Traverse failure paths customer journeys SLOs impacts and recovery options</text><text x="1310" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Decide and authorize</text><rect x="1100" y="140" width="420" height="105" rx="16" fill="#FFF2CC" stroke="#6B7785" stroke-width="3"/><text x="1310" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">7 Generate candidates</text><text x="1310" y="207" text-anchor="middle" font-family="Arial" font-size="15">Create provider neutral bounded reversible actions</text><rect x="1100" y="285" width="420" height="105" rx="16" fill="#FFF2CC" stroke="#6B7785" stroke-width="3"/><text x="1310" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">8 Evaluate policy</text><text x="1310" y="352" text-anchor="middle" font-family="Arial" font-size="15">OPA returns allow deny approval requirement and obligations</text><rect x="1100" y="430" width="420" height="105" rx="16" fill="#FFF2CC" stroke="#6B7785" stroke-width="3"/><text x="1310" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">9 Authorize</text><text x="1310" y="497" text-anchor="middle" font-family="Arial" font-size="15">Issue signed audience bound expiring single use authorization</text><text x="1830" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Execute and validate</text><rect x="1620" y="140" width="420" height="105" rx="16" fill="#FCE4D6" stroke="#6B7785" stroke-width="3"/><text x="1830" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">10 Execute</text><text x="1830" y="207" text-anchor="middle" font-family="Arial" font-size="15">Provider adapter uses idempotency key and bounded parameters</text><rect x="1620" y="285" width="420" height="105" rx="16" fill="#FCE4D6" stroke="#6B7785" stroke-width="3"/><text x="1830" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">11 Validate</text><text x="1830" y="352" text-anchor="middle" font-family="Arial" font-size="15">Run ordered infrastructure platform application AI SLO and customer checks</text><rect x="1620" y="430" width="420" height="105" rx="16" fill="#FCE4D6" stroke="#6B7785" stroke-width="3"/><text x="1830" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">12 Compensate</text><text x="1830" y="497" text-anchor="middle" font-family="Arial" font-size="15">Stop roll back or escalate when validation fails</text><text x="2350" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Evidence and learn</text><rect x="2140" y="140" width="420" height="105" rx="16" fill="#E4DFEC" stroke="#6B7785" stroke-width="3"/><text x="2350" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">13 Close</text><text x="2350" y="207" text-anchor="middle" font-family="Arial" font-size="15">Confirm stable window and customer outcome</text><rect x="2140" y="285" width="420" height="105" rx="16" fill="#E4DFEC" stroke="#6B7785" stroke-width="3"/><text x="2350" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">14 Record</text><text x="2350" y="352" text-anchor="middle" font-family="Arial" font-size="15">Create reconstructable DecisionEnvelope and evidence package</text><rect x="2140" y="430" width="420" height="105" rx="16" fill="#E4DFEC" stroke="#6B7785" stroke-width="3"/><text x="2350" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">15 Improve</text><text x="2350" y="497" text-anchor="middle" font-family="Arial" font-size="15">Update rules runbooks mappings tests and optional models through governance</text></svg>