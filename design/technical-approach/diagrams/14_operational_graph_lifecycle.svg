<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500"><rect width="100%" height="100%" fill="white"/><text x="1100.0" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#163A5F">Operational Graph Lifecycle During Assessment and Recovery</text><text x="270" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Continuous graph</text><rect x="60" y="140" width="420" height="105" rx="16" fill="#D9EAF7" stroke="#6B7785" stroke-width="3"/><text x="270" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Qualified evidence</text><text x="270" y="207" text-anchor="middle" font-family="Arial" font-size="15">Inventory telemetry traces changes and security signals</text><rect x="60" y="285" width="420" height="105" rx="16" fill="#D9EAF7" stroke="#6B7785" stroke-width="3"/><text x="270" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Incremental projection</text><text x="270" y="352" text-anchor="middle" font-family="Arial" font-size="15">Update only affected nodes and relationships</text><rect x="60" y="430" width="420" height="105" rx="16" fill="#D9EAF7" stroke="#6B7785" stroke-width="3"/><text x="270" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Current trusted state</text><text x="270" y="497" text-anchor="middle" font-family="Arial" font-size="15">Latest reconciled tenant and environment topology</text><text x="790" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Decision context</text><rect x="580" y="140" width="420" height="105" rx="16" fill="#E2F0D9" stroke="#6B7785" stroke-width="3"/><text x="790" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Graph revision</text><text x="790" y="207" text-anchor="middle" font-family="Arial" font-size="15">Immutable identifier and parent revision metadata</text><rect x="580" y="285" width="420" height="105" rx="16" fill="#E2F0D9" stroke="#6B7785" stroke-width="3"/><text x="790" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Action relevant subgraph</text><text x="790" y="352" text-anchor="middle" font-family="Arial" font-size="15">Only origin dependencies impacts controls and recovery paths</text><rect x="580" y="430" width="420" height="105" rx="16" fill="#E2F0D9" stroke="#6B7785" stroke-width="3"/><text x="790" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Canonical digest</text><text x="790" y="497" text-anchor="middle" font-family="Arial" font-size="15">Hash of normalized nodes relationships and decision query context</text><text x="1310" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Governed recovery</text><rect x="1100" y="140" width="420" height="105" rx="16" fill="#FFF2CC" stroke="#6B7785" stroke-width="3"/><text x="1310" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Assess and Control</text><text x="1310" y="207" text-anchor="middle" font-family="Arial" font-size="15">Witness paths candidate policy approval and authorization</text><rect x="1100" y="285" width="420" height="105" rx="16" fill="#FFF2CC" stroke="#6B7785" stroke-width="3"/><text x="1310" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Pre execution comparison</text><text x="1310" y="352" text-anchor="middle" font-family="Arial" font-size="15">Compare authorized subgraph with current graph</text><rect x="1100" y="430" width="420" height="105" rx="16" fill="#FFF2CC" stroke="#6B7785" stroke-width="3"/><text x="1310" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Execute and validate</text><text x="1310" y="497" text-anchor="middle" font-family="Arial" font-size="15">Run bounded action and cross layer stable window</text><text x="1830" y="115" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">History and learning</text><rect x="1620" y="140" width="420" height="105" rx="16" fill="#FCE4D6" stroke="#6B7785" stroke-width="3"/><text x="1830" y="174" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Post recovery projection</text><text x="1830" y="207" text-anchor="middle" font-family="Arial" font-size="15">Qualified observations update the same operational graph</text><rect x="1620" y="285" width="420" height="105" rx="16" fill="#FCE4D6" stroke="#6B7785" stroke-width="3"/><text x="1830" y="319" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Later revisions</text><text x="1830" y="352" text-anchor="middle" font-family="Arial" font-size="15">Recovered state and stable outcome receive new revision identifiers</text><rect x="1620" y="430" width="420" height="105" rx="16" fill="#FCE4D6" stroke="#6B7785" stroke-width="3"/><text x="1830" y="464" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#163A5F">Decision snapshot</text><text x="1830" y="497" text-anchor="middle" font-family="Arial" font-size="15">Retain subgraph witness paths evidence and digests for replay</text></svg>