<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>Proposed import and signal records</title><rect width="1400" height="920" fill="#f3f6fa"/><g font-family="Arial,sans-serif" fill="#193651"><text x="30" y="55" font-size="30">Proposed import and signal records</text><text x="30" y="98" font-size="18">Proposed design extension   Not an applied migration or executed integration</text><rect x="30" y="150" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="48" y="190" font-size="22">1   Source binding</text><text x="48" y="235" font-size="19">Authorized connection and workload</text><text x="48" y="263" font-size="19">mapping</text><rect x="490" y="150" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="508" y="190" font-size="22">2   Source checkpoint</text><text x="508" y="235" font-size="19">Opaque version digest and verified</text><text x="508" y="263" font-size="19">coverage</text><rect x="950" y="150" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="968" y="190" font-size="22">3   Import candidate</text><text x="968" y="235" font-size="19">Original normalized and local</text><text x="968" y="263" font-size="19">definitions</text><rect x="30" y="380" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="48" y="420" font-size="22">4   Resolution history</text><text x="48" y="465" font-size="19">Keep local propose source or</text><text x="48" y="493" font-size="19">detach</text><rect x="490" y="380" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="508" y="420" font-size="22">5   Collection policy</text><text x="508" y="465" font-size="19">Versioned collection freshness</text><text x="508" y="493" font-size="19">evaluation</text><rect x="950" y="380" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="968" y="420" font-size="22">6   Signal receipt</text><text x="968" y="465" font-size="19">Observed time received time and</text><text x="968" y="493" font-size="19">integrity</text><rect x="30" y="610" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="48" y="650" font-size="22">7   Evaluation schedule</text><text x="48" y="695" font-size="19">Scoped due work and expiring</text><text x="48" y="723" font-size="19">leases</text><text x="30" y="870" font-size="18">Seven proposed record families outside the applied migration baseline</text></g></svg>