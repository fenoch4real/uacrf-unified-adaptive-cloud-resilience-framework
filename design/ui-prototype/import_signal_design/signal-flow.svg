<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>From source observations to governed decisions</title><rect width="1400" height="920" fill="#f3f6fa"/><g font-family="Arial,sans-serif" fill="#193651"><text x="30" y="55" font-size="30">From source observations to governed decisions</text><text x="30" y="98" font-size="18">Proposed design extension   Not an applied migration or executed integration</text><rect x="30" y="150" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="48" y="190" font-size="22">1   Approved source</text><text x="48" y="235" font-size="19">Cloud monitoring business or agent</text><text x="48" y="263" font-size="19">runtime</text><path d="M454 230h28m-8-6 9 6-9 6" fill="none" stroke="#087f8c" stroke-width="2"/><rect x="490" y="150" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="508" y="190" font-size="22">2   Scoped adapter</text><text x="508" y="235" font-size="19">Event delivery polling and</text><text x="508" y="263" font-size="19">reconciliation</text><path d="M914 230h28m-8-6 9 6-9 6" fill="none" stroke="#087f8c" stroke-width="2"/><rect x="950" y="150" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="968" y="190" font-size="22">3   Trusted admission</text><text x="968" y="235" font-size="19">Identity integrity deduplication</text><text x="968" y="263" font-size="19">and ordering</text><rect x="30" y="380" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="48" y="420" font-size="22">4   Qualified evidence</text><text x="48" y="465" font-size="19">Coverage purpose and expiry checks</text><path d="M454 460h28m-8-6 9 6-9 6" fill="none" stroke="#087f8c" stroke-width="2"/><rect x="490" y="380" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="508" y="420" font-size="22">5   Scoped evaluation</text><text x="508" y="465" font-size="19">Exact objective graph and policy</text><text x="508" y="493" font-size="19">revisions</text><path d="M914 460h28m-8-6 9 6-9 6" fill="none" stroke="#087f8c" stroke-width="2"/><rect x="950" y="380" width="420" height="175" rx="10" fill="white" stroke="#bdd3e2"/><text x="968" y="420" font-size="22">6   Governed action</text><text x="968" y="465" font-size="19">Current authority and pre-dispatch</text><text x="968" y="493" font-size="19">recheck</text><text x="30" y="870" font-size="18">Review sequence only   No live collector evaluator or recovery is established</text><path d="M1160 325V350H15V460H28m-8-6 9 6-9 6" fill="none" stroke="#087f8c" stroke-width="2"/></g></svg>