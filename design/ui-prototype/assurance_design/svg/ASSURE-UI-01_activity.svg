<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="#f5f8fc"/><text x="40" y="40" font-family="Arial" font-size="23" fill="#17334e">ASSURE-UI-01 Follow one assessment across application workspaces</text><text x="40" y="70" font-family="Arial" font-size="16">Activity · Version 1.0 · Diagnostic workflow</text><rect x="40" y="95" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="120" font-family="Arial" font-size="16" font-weight="bold">S01  Human → Main UI</text><text x="60" y="148" font-family="Arial" font-size="16">Choose a registered example journey inside Assess</text><text x="995" y="145" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 199 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="223" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="248" font-family="Arial" font-size="16" font-weight="bold">S02  Main UI → Main UI</text><text x="60" y="276" font-family="Arial" font-size="16">Validate scenario reason workload and local owner before local baseline creation</text><text x="995" y="273" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 327 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="351" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="376" font-family="Arial" font-size="16" font-weight="bold">S03  Human → Main UI</text><text x="60" y="404" font-family="Arial" font-size="16">Inspect a local change and review the diagnostic result</text><text x="995" y="401" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 455 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="479" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="504" font-family="Arial" font-size="16" font-weight="bold">S04  Main UI → Main UI</text><text x="60" y="532" font-family="Arial" font-size="16">Append local reassessment and preserve earlier local reviews</text><text x="995" y="529" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 583 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="607" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="632" font-family="Arial" font-size="16" font-weight="bold">S05  Main UI → Human</text><text x="60" y="660" font-family="Arial" font-size="16">Show the same scoped status in journey graph evidence recovery and activity views</text><text x="40" y="775" font-family="Arial" font-size="15" fill="#854816">F1 Stop on failed gates. Return a restrictive error or insufficient evidence. No certification or execution.</text></svg>