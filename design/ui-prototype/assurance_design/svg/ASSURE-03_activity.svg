<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="#f5f8fc"/><text x="40" y="40" font-family="Arial" font-size="23" fill="#17334e">ASSURE-03 Read evidence limits and preserve history</text><text x="40" y="70" font-family="Arial" font-size="16">Activity · Version 1.0 · Diagnostic workflow</text><rect x="40" y="95" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="120" font-family="Arial" font-size="16" font-weight="bold">S01  Human → Java API</text><text x="60" y="148" font-family="Arial" font-size="16">Request current diagnostic assessment</text><text x="995" y="145" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 199 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="223" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="248" font-family="Arial" font-size="16" font-weight="bold">S02  Java API → PostgreSQL</text><text x="60" y="276" font-family="Arial" font-size="16">Recheck current actor grants journey linkage and represented workloads</text><text x="995" y="273" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 327 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="351" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="376" font-family="Arial" font-size="16" font-weight="bold">S03  Java API → Neo4j</text><text x="60" y="404" font-family="Arial" font-size="16">Verify latest reviewed graph when its evidence remains eligible</text><text x="995" y="401" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 455 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="479" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="504" font-family="Arial" font-size="16" font-weight="bold">S04  Java API → Java API</text><text x="60" y="532" font-family="Arial" font-size="16">Derive insufficient evidence or pending review without rewriting history</text><text x="995" y="529" font-family="Arial" font-size="14" fill="#8d4f13">Fail → F1</text><path d="M480 583 v24" stroke="#4b718f" stroke-width="2"/><rect x="40" y="607" width="940" height="104" rx="8" fill="white" stroke="#8ba4ba"/><text x="60" y="632" font-family="Arial" font-size="16" font-weight="bold">S05  Java API → Human</text><text x="60" y="660" font-family="Arial" font-size="16">Return bounded history pending revisions and explicit diagnostic limits</text><text x="40" y="775" font-family="Arial" font-size="15" fill="#854816">F1 Stop on failed gates. Return a restrictive error or insufficient evidence. No certification or execution.</text></svg>