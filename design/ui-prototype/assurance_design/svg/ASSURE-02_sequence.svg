<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#32688f"/></marker></defs><rect width="1120" height="1130" fill="#f5f8fc"/><text x="25" y="35" font-family="Arial" font-size="22">ASSURE-02 Review changes against the immutable baseline</text><text x="25" y="62" font-family="Arial" font-size="15">Sequence · Version 1.0 · Local diagnostic workflow</text><rect x="30" y="85" width="170" height="42" rx="5" fill="white" stroke="#8ca5bc"/><text x="50" y="112" font-family="Arial" font-size="18">Human</text><path d="M115 128 V1065" stroke="#b1c2d2" stroke-dasharray="5 5"/><rect x="320" y="85" width="170" height="42" rx="5" fill="white" stroke="#8ca5bc"/><text x="340" y="112" font-family="Arial" font-size="18">Java API</text><path d="M405 128 V1065" stroke="#b1c2d2" stroke-dasharray="5 5"/><rect x="615" y="85" width="170" height="42" rx="5" fill="white" stroke="#8ca5bc"/><text x="635" y="112" font-family="Arial" font-size="18">PostgreSQL</text><path d="M700 128 V1065" stroke="#b1c2d2" stroke-dasharray="5 5"/><rect x="905" y="85" width="170" height="42" rx="5" fill="white" stroke="#8ca5bc"/><text x="925" y="112" font-family="Arial" font-size="18">Neo4j</text><path d="M990 128 V1065" stroke="#b1c2d2" stroke-dasharray="5 5"/><path d="M115 183 H405" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="215" font-family="Arial" font-size="15">S01 Read assessment and pending accepted graph revisions</text><text x="30" y="263" font-family="Arial" font-size="13" fill="#895218">Gate S01 · fail or incomplete → F1 stop</text><path d="M405 313 H700" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="345" font-family="Arial" font-size="15">S02 Check current access to baseline review history and pending graph scopes</text><text x="30" y="393" font-family="Arial" font-size="13" fill="#895218">Gate S02 · fail or incomplete → F1 stop</text><path d="M115 443 H405" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="475" font-family="Arial" font-size="15">S03 Select accepted graph and submit expected revision and review reason</text><text x="30" y="523" font-family="Arial" font-size="13" fill="#895218">Gate S03 · fail or incomplete → F1 stop</text><path d="M405 573 H990" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="605" font-family="Arial" font-size="15">S04 Verify selected projection and current SQL evidence eligibility</text><text x="30" y="653" font-family="Arial" font-size="13" fill="#895218">Gate S04 · fail or incomplete → F1 stop</text><path d="M405 693 h45 v20 h-45" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="735" font-family="Arial" font-size="15">S05 Compare relevant nodes and semantic relationships with the original baseline</text><text x="30" y="783" font-family="Arial" font-size="13" fill="#895218">Gate S05 · fail or incomplete → F1 stop</text><path d="M405 833 H700" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="865" font-family="Arial" font-size="15">S06 Append review with revision fencing audit and notification outbox</text><text x="30" y="913" font-family="Arial" font-size="13" fill="#895218">Gate S06 · fail or incomplete → F1 stop</text><path d="M405 963 H115" fill="none" stroke="#32688f" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="995" font-family="Arial" font-size="15">S07 Explain relevant changes shared dependencies and required retest review</text><text x="25" y="1107" font-family="Arial" font-size="15">F1 Return restrictive errors or insufficient evidence. No certification or recovery authority.</text></svg>