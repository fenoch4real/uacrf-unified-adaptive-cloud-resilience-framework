<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#32536d"/></marker></defs><rect width="1080" height="660" fill="#f5f8fc"/><rect x="28" y="20" width="490" height="202" rx="10" fill="#e6f4eb" stroke="#9bb0c3"/><text x="46" y="52" font-family="Arial" font-size="22" font-weight="bold" fill="#15324b">PostgreSQL accepted source</text><text x="46" y="86" font-family="Arial" font-size="18" fill="#15324b">graph_revision: scope, digest, watermark</text><text x="46" y="114" font-family="Arial" font-size="18" fill="#15324b">graph_node / graph_edge: typed facts</text><text x="46" y="142" font-family="Arial" font-size="18" fill="#15324b">evidence_event / evidence_qualification</text><text x="46" y="170" font-family="Arial" font-size="18" fill="#15324b">Immutable accepted revision and audit</text><rect x="28" y="265" width="490" height="160" rx="10" fill="#e6f4eb" stroke="#9bb0c3"/><text x="46" y="297" font-family="Arial" font-size="22" font-weight="bold" fill="#15324b">PostgreSQL runtime extension</text><text x="46" y="331" font-family="Arial" font-size="18" fill="#15324b">graph_projection: lease, retry, acknowledgement</text><text x="46" y="359" font-family="Arial" font-size="18" fill="#15324b">graph_worker_binding: login to scope</text><text x="46" y="387" font-family="Arial" font-size="18" fill="#15324b">graph_projection_event: immutable history</text><text x="46" y="415" font-family="Arial" font-size="18" fill="#15324b">Three runtime tables outside baseline</text><rect x="575" y="20" width="475" height="202" rx="10" fill="#e3f0fa" stroke="#9bb0c3"/><text x="593" y="52" font-family="Arial" font-size="22" font-weight="bold" fill="#15324b">Neo4j verified projection</text><text x="593" y="86" font-family="Arial" font-size="18" fill="#15324b">UACRFEntity: typed service, agent, resource</text><text x="593" y="114" font-family="Arial" font-size="18" fill="#15324b">Typed relationships with exact identities</text><text x="593" y="142" font-family="Arial" font-size="18" fill="#15324b">UACRFBatch: SEALED, digest, counts</text><text x="593" y="170" font-family="Arial" font-size="18" fill="#15324b">Unique scope and revision constraints</text><rect x="575" y="265" width="475" height="160" rx="10" fill="#fff1dd" stroke="#9bb0c3"/><text x="593" y="297" font-family="Arial" font-size="22" font-weight="bold" fill="#15324b">Java Spring Boot boundary</text><text x="593" y="331" font-family="Arial" font-size="18" fill="#15324b">GraphAdmin accepts qualified source</text><text x="593" y="359" font-family="Arial" font-size="18" fill="#15324b">GraphWorker projects then acknowledges</text><text x="593" y="387" font-family="Arial" font-size="18" fill="#15324b">GraphService checks both stores on reads</text><rect x="28" y="480" width="1022" height="145" rx="10" fill="#ffffff" stroke="#9bb0c3"/><text x="46" y="512" font-family="Arial" font-size="22" font-weight="bold" fill="#15324b">Availability is a verified relationship between both stores</text><text x="46" y="546" font-family="Arial" font-size="18" fill="#15324b">1  Accept in SQL     2  Lease work     3  Commit Neo4j     4  Acknowledge in SQL</text><text x="46" y="574" font-family="Arial" font-size="18" fill="#15324b">5  Authorize and verify both stores     6  Return revision-bound graph or restrictive result</text><text x="46" y="602" font-family="Arial" font-size="18" fill="#15324b">A graph view is not recovery certification and does not authorize a cloud action.</text><line x1="275" y1="222" x2="275" y2="260" stroke="#32536d" stroke-width="3" marker-end="url(#arrow)"/><line x1="518" y1="102" x2="565" y2="102" stroke="#32536d" stroke-width="3" marker-end="url(#arrow)"/><line x1="575" y1="345" x2="528" y2="345" stroke="#32536d" stroke-width="3" marker-end="url(#arrow)"/><line x1="810" y1="265" x2="810" y2="230" stroke="#32536d" stroke-width="3" marker-end="url(#arrow)"/><line x1="300" y1="425" x2="300" y2="470" stroke="#32536d" stroke-width="3" marker-end="url(#arrow)"/><line x1="810" y1="425" x2="810" y2="470" stroke="#32536d" stroke-width="3" marker-end="url(#arrow)"/></svg>