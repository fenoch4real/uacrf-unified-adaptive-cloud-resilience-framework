<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="991" viewBox="0 0 1300 991" role="img" aria-label="GRAPH-03 sequence"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#486a90"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#ae4242"/></marker></defs><rect width="1300" height="991" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="26" text-anchor="start" fill="#18304c">GRAPH-03 · Read dependencies and bounded diagnostic witnesses</text><text x="30" y="111" font-size="17" text-anchor="start" fill="#18304c">SEQUENCE · Logical lifecycle, not a promise of one long HTTP transaction. All SQL transactions end before network calls.</text><rect x="8.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="95.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Caller</text><line x1="95.0" y1="190" x2="95.0" y2="851" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="378.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="465.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Spring Boot</text><line x1="465.0" y1="190" x2="465.0" y2="851" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="748.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="835.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">PostgreSQL</text><line x1="835.0" y1="190" x2="835.0" y2="851" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="1118.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="1205.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Neo4j</text><line x1="1205.0" y1="190" x2="1205.0" y2="851" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="101.0" y="198" width="358.0" height="51" rx="4" fill="#fff0d6"/><text x="280.0" y="216" font-size="15" text-anchor="middle" fill="#18304c">S01 · Submit a verified token explicit graph</text><text x="280.0" y="236" font-size="15" text-anchor="middle" fill="#18304c">revision and bounded parameters</text><line x1="95.0" y1="278" x2="459.0" y2="278" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="471.0" y="298" width="358.0" height="51" rx="4" fill="#e4f5e9"/><text x="650.0" y="316" font-size="15" text-anchor="middle" fill="#18304c">S02 · Check current identity all workload</text><text x="650.0" y="336" font-size="15" text-anchor="middle" fill="#18304c">scopes evidence and projection acknowledgement</text><line x1="465.0" y1="378" x2="829.0" y2="378" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="540.0" y="398" width="590" height="30" rx="4" fill="#e1f2f4"/><text x="835.0" y="416" font-size="15" text-anchor="middle" fill="#18304c">S03 · Compare sealed receipt watermark counts and full projected content</text><line x1="465.0" y1="478" x2="1199.0" y2="478" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="365.0" y="498" width="250" height="93" rx="4" fill="#fff0d6"/><text x="375.0" y="516" font-size="15" text-anchor="start" fill="#18304c">S04 · Return typed topology</text><text x="375.0" y="536" font-size="15" text-anchor="start" fill="#18304c">or calculate</text><text x="375.0" y="556" font-size="15" text-anchor="start" fill="#18304c">direction-aware bounded</text><text x="375.0" y="576" font-size="15" text-anchor="start" fill="#18304c">diagnostic witnesses</text><path d="M465.0,608 H620.0 V624 H470.0" fill="none" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="475.0" y="634" width="350" height="51" rx="4" fill="#e4f5e9"/><text x="650.0" y="652" font-size="15" text-anchor="middle" fill="#18304c">S05 · Recheck accepted source evidence and</text><text x="650.0" y="672" font-size="15" text-anchor="middle" fill="#18304c">acknowledgement before finishing</text><line x1="465.0" y1="714" x2="829.0" y2="714" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="109.0" y="734" width="342" height="51" rx="4" fill="#fff0d6"/><text x="280.0" y="752" font-size="15" text-anchor="middle" fill="#18304c">S06 · Return revision-bound scope-limited</text><text x="280.0" y="772" font-size="15" text-anchor="middle" fill="#18304c">results with no recovery certification</text><line x1="465.0" y1="814" x2="101.0" y2="814" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="30" y="884" font-size="15" text-anchor="start" fill="#18304c">F1 restrictive outcome: F1 Stop on denied scope, stale evidence, invalid source, lease loss, digest mismatch, store outage or incomplete traversal. No certification or</text><text x="30" y="904" font-size="15" text-anchor="start" fill="#18304c">F1 restrictive outcome: recovery authority is granted.</text></g></svg>