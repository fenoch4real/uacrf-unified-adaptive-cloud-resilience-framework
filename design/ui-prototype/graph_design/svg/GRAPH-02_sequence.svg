<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1069" viewBox="0 0 1300 1069" role="img" aria-label="GRAPH-02 sequence"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#486a90"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#ae4242"/></marker></defs><rect width="1300" height="1069" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="26" text-anchor="start" fill="#18304c">GRAPH-02 · Project an accepted revision across both stores</text><text x="30" y="111" font-size="17" text-anchor="start" fill="#18304c">SEQUENCE · Logical lifecycle, not a promise of one long HTTP transaction. All SQL transactions end before network calls.</text><rect x="8.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="95.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Java worker</text><line x1="95.0" y1="190" x2="95.0" y2="929" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="563.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="650.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">PostgreSQL</text><line x1="650.0" y1="190" x2="650.0" y2="929" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="1118.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="1205.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Neo4j</text><line x1="1205.0" y1="190" x2="1205.0" y2="929" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="101.5" y="198" width="542" height="51" rx="4" fill="#e4f5e9"/><text x="372.5" y="216" font-size="15" text-anchor="middle" fill="#18304c">S01 · Claim work using the login-bound environment and an expiring</text><text x="372.5" y="236" font-size="15" text-anchor="middle" fill="#18304c">lease</text><line x1="95.0" y1="278" x2="644.0" y2="278" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="125.5" y="298" width="494" height="30" rx="4" fill="#fff0d6"/><text x="372.5" y="316" font-size="15" text-anchor="middle" fill="#18304c">S02 · Commit lease and export canonical snapshot with digest</text><line x1="650.0" y1="378" x2="101.0" y2="378" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="12" y="398" width="250" height="72" rx="4" fill="#fff0d6"/><text x="22" y="416" font-size="15" text-anchor="start" fill="#18304c">S03 · Verify canonical</text><text x="22" y="436" font-size="15" text-anchor="start" fill="#18304c">bytes protocol identities</text><text x="22" y="456" font-size="15" text-anchor="start" fill="#18304c">and projection allowlist</text><path d="M95.0,486 H250.0 V502 H100.0" fill="none" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="383.0" y="512" width="534" height="51" rx="4" fill="#e1f2f4"/><text x="650.0" y="530" font-size="15" text-anchor="middle" fill="#18304c">S04 · Write nodes relationships and sealed receipt in one managed</text><text x="650.0" y="550" font-size="15" text-anchor="middle" fill="#18304c">transaction</text><line x1="95.0" y1="592" x2="1199.0" y2="592" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="379.0" y="612" width="542" height="51" rx="4" fill="#fff0d6"/><text x="650.0" y="630" font-size="15" text-anchor="middle" fill="#18304c">S05 · Commit exact verified graph or recognize an identical sealed</text><text x="650.0" y="650" font-size="15" text-anchor="middle" fill="#18304c">duplicate</text><line x1="1205.0" y1="692" x2="101.0" y2="692" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="101.0" y="712" width="543.0" height="30" rx="4" fill="#e4f5e9"/><text x="372.5" y="730" font-size="15" text-anchor="middle" fill="#18304c">S06 · Acknowledge the current lease and digest after the Neo4j commit</text><line x1="95.0" y1="792" x2="644.0" y2="792" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="101.0" y="812" width="543.0" height="51" rx="4" fill="#fff0d6"/><text x="372.5" y="830" font-size="15" text-anchor="middle" fill="#18304c">S07 · Mark projected or retain delayed retry after failure or lease</text><text x="372.5" y="850" font-size="15" text-anchor="middle" fill="#18304c">expiry</text><line x1="650.0" y1="892" x2="101.0" y2="892" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="30" y="962" font-size="15" text-anchor="start" fill="#18304c">F1 restrictive outcome: F1 Stop on denied scope, stale evidence, invalid source, lease loss, digest mismatch, store outage or incomplete traversal. No certification or</text><text x="30" y="982" font-size="15" text-anchor="start" fill="#18304c">F1 restrictive outcome: recovery authority is granted.</text></g></svg>