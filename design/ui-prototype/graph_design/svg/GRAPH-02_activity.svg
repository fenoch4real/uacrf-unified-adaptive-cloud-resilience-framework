<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1309" viewBox="0 0 1500 1309" role="img" aria-label="GRAPH-02 activity"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#486a90"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#ae4242"/></marker></defs><rect width="1500" height="1309" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="26" text-anchor="start" fill="#18304c">GRAPH-02 · Project an accepted revision across both stores</text><text x="35" y="112" font-size="17" text-anchor="start" fill="#18304c">ACTIVITY · Sxx labels match the sequence and step table. Read downward; F1 is restrictive handling.</text><rect x="1065" y="175" width="400" height="170" rx="12" fill="#ffe9e6" stroke="#b95858"/><text x="1085" y="203" font-size="16" text-anchor="start" fill="#18304c">F1 — F1 Stop on denied scope, stale</text><text x="1085" y="224" font-size="16" text-anchor="start" fill="#18304c">evidence, invalid source, lease loss,</text><text x="1085" y="245" font-size="16" text-anchor="start" fill="#18304c">digest mismatch, store outage or</text><text x="1085" y="266" font-size="16" text-anchor="start" fill="#18304c">incomplete traversal. No</text><text x="1085" y="287" font-size="16" text-anchor="start" fill="#18304c">certification or recovery authority</text><text x="1085" y="308" font-size="16" text-anchor="start" fill="#18304c">is granted.</text><text x="1085" y="380" font-size="15" text-anchor="start" fill="#18304c">Retain the reason and required evidence.</text><text x="1085" y="400" font-size="15" text-anchor="start" fill="#18304c">No fabricated success or authority.</text><polygon points="93,170 847,170 875,222.5 847,275 93,275 65,222.5" fill="#e4f5e9" stroke="#718ca8"/><text x="470" y="195" font-size="15" text-anchor="middle" fill="#18304c">S01 · PostgreSQL · SQL</text><text x="470" y="221" font-size="17" text-anchor="middle" fill="#18304c">Claim work using the login-bound environment and an expiring</text><text x="470" y="243" font-size="17" text-anchor="middle" fill="#18304c">lease</text><line x1="470" y1="275" x2="470" y2="311" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="482" y="298" font-size="12" text-anchor="start" fill="#18304c">pass / admitted</text><rect x="65" y="317" width="810" height="105" rx="10" fill="#fff0d6" stroke="#829bb7"/><text x="470" y="342" font-size="15" text-anchor="middle" fill="#18304c">S02 · Java worker · APP</text><text x="470" y="368" font-size="17" text-anchor="middle" fill="#18304c">Commit lease and export canonical snapshot with digest</text><line x1="470" y1="422" x2="470" y2="458" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><polygon points="93,464 847,464 875,516.5 847,569 93,569 65,516.5" fill="#fff0d6" stroke="#718ca8"/><text x="470" y="489" font-size="15" text-anchor="middle" fill="#18304c">S03 · Java worker · APP</text><text x="470" y="515" font-size="17" text-anchor="middle" fill="#18304c">Verify canonical bytes protocol identities and projection</text><text x="470" y="537" font-size="17" text-anchor="middle" fill="#18304c">allowlist</text><line x1="470" y1="569" x2="470" y2="605" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="482" y="592" font-size="12" text-anchor="start" fill="#18304c">pass / admitted</text><polygon points="93,611 847,611 875,663.5 847,716 93,716 65,663.5" fill="#e1f2f4" stroke="#718ca8"/><text x="470" y="636" font-size="15" text-anchor="middle" fill="#18304c">S04 · Neo4j · GRAPH</text><text x="470" y="662" font-size="17" text-anchor="middle" fill="#18304c">Write nodes relationships and sealed receipt in one managed</text><text x="470" y="684" font-size="17" text-anchor="middle" fill="#18304c">transaction</text><line x1="470" y1="716" x2="470" y2="752" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="482" y="739" font-size="12" text-anchor="start" fill="#18304c">pass / admitted</text><polygon points="93,758 847,758 875,810.5 847,863 93,863 65,810.5" fill="#fff0d6" stroke="#718ca8"/><text x="470" y="783" font-size="15" text-anchor="middle" fill="#18304c">S05 · Java worker · APP</text><text x="470" y="809" font-size="17" text-anchor="middle" fill="#18304c">Commit exact verified graph or recognize an identical sealed</text><text x="470" y="831" font-size="17" text-anchor="middle" fill="#18304c">duplicate</text><line x1="470" y1="863" x2="470" y2="899" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="482" y="886" font-size="12" text-anchor="start" fill="#18304c">pass / admitted</text><polygon points="93,905 847,905 875,957.5 847,1010 93,1010 65,957.5" fill="#e4f5e9" stroke="#718ca8"/><text x="470" y="930" font-size="15" text-anchor="middle" fill="#18304c">S06 · PostgreSQL · SQL</text><text x="470" y="956" font-size="17" text-anchor="middle" fill="#18304c">Acknowledge the current lease and digest after the Neo4j commit</text><line x1="470" y1="1010" x2="470" y2="1046" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="482" y="1033" font-size="12" text-anchor="start" fill="#18304c">pass / admitted</text><rect x="65" y="1052" width="810" height="105" rx="10" fill="#fff0d6" stroke="#829bb7"/><text x="470" y="1077" font-size="15" text-anchor="middle" fill="#18304c">S07 · Java worker · APP</text><text x="470" y="1103" font-size="17" text-anchor="middle" fill="#18304c">Mark projected or retain delayed retry after failure or lease</text><text x="470" y="1125" font-size="17" text-anchor="middle" fill="#18304c">expiry</text><path d="M1005,222.5 V957.5" fill="none" stroke="#ae4242" stroke-width="1.5"/><path d="M875,222.5 H1005" fill="none" stroke="#ae4242" stroke-width="1.5"/><text x="886" y="213.5" font-size="11" text-anchor="start" fill="#9f3535">fail / incomplete</text><path d="M875,516.5 H1005" fill="none" stroke="#ae4242" stroke-width="1.5"/><text x="886" y="507.5" font-size="11" text-anchor="start" fill="#9f3535">fail / incomplete</text><path d="M875,663.5 H1005" fill="none" stroke="#ae4242" stroke-width="1.5"/><text x="886" y="654.5" font-size="11" text-anchor="start" fill="#9f3535">fail / incomplete</text><path d="M875,810.5 H1005" fill="none" stroke="#ae4242" stroke-width="1.5"/><text x="886" y="801.5" font-size="11" text-anchor="start" fill="#9f3535">fail / incomplete</text><path d="M875,957.5 H1005" fill="none" stroke="#ae4242" stroke-width="1.5"/><text x="886" y="948.5" font-size="11" text-anchor="start" fill="#9f3535">fail / incomplete</text><path d="M1005,260.0 H1058" fill="none" stroke="#ae4242" stroke-width="2" marker-end="url(#red)"/><text x="35" y="1254" font-size="15" text-anchor="start" fill="#18304c">Before admission: deny without a domain write. After commit: retain the blocked receipt.</text><text x="35" y="1274" font-size="15" text-anchor="start" fill="#18304c">After an external effect: retain AMBIGUOUS and reconcile; a SQL rollback cannot undo that effect.</text></g></svg>