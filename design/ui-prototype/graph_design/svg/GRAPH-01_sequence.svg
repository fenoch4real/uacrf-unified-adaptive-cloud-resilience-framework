<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1105" viewBox="0 0 1300 1105" role="img" aria-label="GRAPH-01 sequence"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#486a90"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#ae4242"/></marker></defs><rect width="1300" height="1105" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="26" text-anchor="start" fill="#18304c">GRAPH-01 · Import and accept an attributable graph source</text><text x="30" y="111" font-size="17" text-anchor="start" fill="#18304c">SEQUENCE · Logical lifecycle, not a promise of one long HTTP transaction. All SQL transactions end before network calls.</text><rect x="8.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="95.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Operator</text><line x1="95.0" y1="190" x2="95.0" y2="965" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="563.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="650.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">Java admin</text><line x1="650.0" y1="190" x2="650.0" y2="965" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="1118.0" y="140" width="174" height="46" rx="7" fill="#dce8f7" stroke="#7c97b7"/><text x="1205.0" y="161" font-size="14" text-anchor="middle" fill="#18304c">PostgreSQL</text><line x1="1205.0" y1="190" x2="1205.0" y2="965" stroke="#9cacc0" stroke-dasharray="5 4"/><rect x="129.5" y="198" width="486" height="51" rx="4" fill="#fff0d6"/><text x="372.5" y="216" font-size="15" text-anchor="middle" fill="#18304c">S01 · Verify source file hash manifest contract and current</text><text x="372.5" y="236" font-size="15" text-anchor="middle" fill="#18304c">source-verified human</text><line x1="95.0" y1="278" x2="644.0" y2="278" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="656.0" y="298" width="543.0" height="51" rx="4" fill="#e4f5e9"/><text x="927.5" y="316" font-size="15" text-anchor="middle" fill="#18304c">S02 · Begin transaction and derive tenant environment and accountable</text><text x="927.5" y="336" font-size="15" text-anchor="middle" fill="#18304c">actor</text><line x1="650.0" y1="378" x2="1199.0" y2="378" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="656.0" y="398" width="543.0" height="51" rx="4" fill="#e4f5e9"/><text x="927.5" y="416" font-size="15" text-anchor="middle" fill="#18304c">S03 · Insert BUILDING revision with append-only qualified nodes and</text><text x="927.5" y="436" font-size="15" text-anchor="middle" fill="#18304c">typed edges</text><line x1="650.0" y1="478" x2="1199.0" y2="478" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="672.5" y="498" width="510" height="51" rx="4" fill="#e4f5e9"/><text x="927.5" y="516" font-size="15" text-anchor="middle" fill="#18304c">S04 · Lock revision and verify current qualifications workload</text><text x="927.5" y="536" font-size="15" text-anchor="middle" fill="#18304c">bindings and capacity</text><line x1="650.0" y1="578" x2="1199.0" y2="578" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="1038" y="598" width="250" height="72" rx="4" fill="#e4f5e9"/><text x="1048" y="616" font-size="15" text-anchor="start" fill="#18304c">S05 · Finalize canonical</text><text x="1048" y="636" font-size="15" text-anchor="start" fill="#18304c">digest through the</text><text x="1048" y="656" font-size="15" text-anchor="start" fill="#18304c">controlled owner procedure</text><path d="M1205.0,686 H1275 V702 H1210.0" fill="none" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="1038" y="712" width="250" height="93" rx="4" fill="#e4f5e9"/><text x="1048" y="730" font-size="15" text-anchor="start" fill="#18304c">S06 · Commit sealed</text><text x="1048" y="750" font-size="15" text-anchor="start" fill="#18304c">revision acceptance audit</text><text x="1048" y="770" font-size="15" text-anchor="start" fill="#18304c">outbox and durable</text><text x="1048" y="790" font-size="15" text-anchor="start" fill="#18304c">projection work</text><path d="M1205.0,822 H1275 V838 H1210.0" fill="none" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><rect x="185.5" y="848" width="374" height="30" rx="4" fill="#fff0d6"/><text x="372.5" y="866" font-size="15" text-anchor="middle" fill="#18304c">S07 · Return pending projection metadata only</text><line x1="650.0" y1="928" x2="101.0" y2="928" stroke="#486a90" stroke-width="2" marker-end="url(#arr)"/><text x="30" y="998" font-size="15" text-anchor="start" fill="#18304c">F1 restrictive outcome: F1 Stop on denied scope, stale evidence, invalid source, lease loss, digest mismatch, store outage or incomplete traversal. No certification or</text><text x="30" y="1018" font-size="15" text-anchor="start" fill="#18304c">F1 restrictive outcome: recovery authority is granted.</text></g></svg>