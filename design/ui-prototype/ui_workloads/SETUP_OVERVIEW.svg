<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1480" viewBox="0 0 1000 1480"><rect width="1000" height="1480" fill="#f3f6fa"/><g font-family="Arial,sans-serif" fill="#17334c"><text x="30" y="45" font-size="29">UACRF setup and recovery review</text><text x="30" y="80" font-size="18">Version 1.0 · Guide revision 21 · Navigation is not acceptance</text><a href="index.html#UI-30" target="_top"><rect x="30" y="115" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="45" y="145" font-size="19">1</text><text x="85" y="151" font-size="21">Agree scope and owners</text></a><text x="480" y="169" font-size="25">→</text><a href="index.html#UI-15" target="_top"><rect x="530" y="115" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="545" y="145" font-size="19">2</text><text x="585" y="151" font-size="21">Prepare a read-only</text><text x="585" y="176" font-size="21">connection</text></a><path d="M750 210 v12 H250 v13" stroke="#628aa7" fill="none"/><text x="244" y="236" font-size="16">↓</text><a href="index.html#UI-17" target="_top"><rect x="30" y="235" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="45" y="265" font-size="19">3</text><text x="85" y="271" font-size="21">Check collection coverage</text></a><text x="480" y="289" font-size="25">→</text><a href="index.html#UI-16" target="_top"><rect x="530" y="235" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="545" y="265" font-size="19">4</text><text x="585" y="271" font-size="21">Register protected</text><text x="585" y="296" font-size="21">capabilities</text></a><path d="M750 330 v12 H250 v13" stroke="#628aa7" fill="none"/><text x="244" y="356" font-size="16">↓</text><a href="index.html#UI-46" target="_top"><rect x="30" y="355" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="45" y="385" font-size="19">5</text><text x="85" y="391" font-size="21">Define the customer journey</text></a><text x="480" y="409" font-size="25">→</text><a href="index.html#UI-48" target="_top"><rect x="530" y="355" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="545" y="385" font-size="19">6</text><text x="585" y="391" font-size="21">Link shared resources</text></a><path d="M750 450 v12 H250 v13" stroke="#628aa7" fill="none"/><text x="244" y="476" font-size="16">↓</text><a href="index.html#UI-18" target="_top"><rect x="30" y="475" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="45" y="505" font-size="19">7</text><text x="85" y="511" font-size="21">Review dependencies and</text><text x="85" y="536" font-size="21">objectives</text></a><text x="480" y="529" font-size="25">→</text><a href="index.html#UI-21" target="_top"><rect x="530" y="475" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="545" y="505" font-size="19">8</text><text x="585" y="511" font-size="21">Establish evidence and</text><text x="585" y="536" font-size="21">policies</text></a><path d="M750 570 v12 H250 v13" stroke="#628aa7" fill="none"/><text x="244" y="596" font-size="16">↓</text><a href="index.html#UI-03" target="_top"><rect x="30" y="595" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="45" y="625" font-size="19">9</text><text x="85" y="631" font-size="21">Establish recovery baseline</text></a><text x="480" y="649" font-size="25">→</text><a href="index.html#UI-27" target="_top"><rect x="530" y="595" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="545" y="625" font-size="19">10</text><text x="585" y="631" font-size="21">Plan a controlled recovery</text><text x="585" y="656" font-size="21">test</text></a><path d="M750 690 v12 H250 v13" stroke="#628aa7" fill="none"/><text x="244" y="716" font-size="16">↓</text><a href="index.html#UI-28" target="_top"><rect x="30" y="715" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="45" y="745" font-size="19">11</text><text x="85" y="751" font-size="21">Validate and retain the</text><text x="85" y="776" font-size="21">result</text></a><text x="480" y="769" font-size="25">→</text><a href="index.html#UI-44" target="_top"><rect x="530" y="715" width="440" height="95" rx="9" fill="white" stroke="#9bb7cb"/><text x="545" y="745" font-size="19">12</text><text x="585" y="751" font-size="21">Review changes and reassess</text></a><text x="30" y="880" font-size="25">After setup keep the baseline under review</text><text x="30" y="915" font-size="18">Change → evidence review → reassessment → agreed retest → return to step 9</text><a href="index.html#UI-20" target="_top"><rect x="30" y="945" width="440" height="90" rx="8" fill="#e6f0f8" stroke="#9bb7cb"/><text x="48" y="983" font-size="21">Inspect changed context</text></a><a href="index.html#UI-06" target="_top"><rect x="530" y="945" width="440" height="90" rx="8" fill="#e6f0f8" stroke="#9bb7cb"/><text x="548" y="983" font-size="21">Refresh missing evidence</text></a><a href="index.html#UI-03" target="_top"><rect x="30" y="1063" width="440" height="90" rx="8" fill="#e6f0f8" stroke="#9bb7cb"/><text x="48" y="1101" font-size="21">Record reassessment</text></a><a href="index.html#UI-27" target="_top"><rect x="530" y="1063" width="440" height="90" rx="8" fill="#e6f0f8" stroke="#9bb7cb"/><text x="548" y="1101" font-size="21">Agree controlled retest</text></a><a href="index.html#UI-03" target="_top"><rect x="30" y="1205" width="940" height="60" rx="8" fill="white" stroke="#537e9e"/><text x="50" y="1243" font-size="22">↺ Return to Assess for the same journey baseline and review history</text></a><text x="30" y="1310" font-size="19">Services and agents use typed shared resources and qualified evidence.</text><text x="30" y="1350" font-size="19">Local prototype only. Expired evidence blocks reassessment.</text><text x="30" y="1390" font-size="19">No API connection, automatic recovery or certification is implied.</text><text x="30" y="1430" font-size="19">Keep operating ownership, escalation and billing review in handover.</text></g></svg>