<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img"><rect width="1500" height="1030" fill="#f3f6fa"/><g font-family="Arial,sans-serif" fill="#193651"><rect width="240" height="1030" fill="#0b263d"/><g fill="white"><text x="25" y="65" font-size="32">UACRF</text><text x="25" y="135" font-size="20">Settings</text><text x="25" y="190" font-size="19">Services</text><text x="25" y="235" font-size="19">Agents</text><text x="25" y="280" font-size="19">Shared resources</text></g><text x="280" y="65" font-size="31">Users and accountable owners</text><text x="280" y="104" font-size="18">Northstar / review · Nonproduction · Fictional data · No live action</text><rect x="280" y="150" width="1160" height="200" rx="10" fill="white" stroke="#bdd3e2"/><text x="300" y="188" font-size="24">1  Admit a verified directory identity</text><text x="300" y="230" font-size="18">Choose an existing fictional source record.</text><text x="300" y="259" font-size="18">The local principal starts without eligibility or grants.</text><rect x="280" y="395" width="1160" height="200" rx="10" fill="white" stroke="#bdd3e2"/><text x="300" y="433" font-size="24">2  Review status and owner eligibility</text><text x="300" y="475" font-size="18">Only enabled people can become eligible owners.</text><text x="300" y="504" font-size="18">Disable preserves history and exposes ownership gaps.</text><rect x="280" y="640" width="1160" height="200" rx="10" fill="white" stroke="#bdd3e2"/><text x="300" y="678" font-size="24">3  Transfer accountable ownership</text><text x="300" y="720" font-size="18">Select an object, eligible replacement and reason.</text><text x="300" y="749" font-size="18">Responsibility changes; access permissions do not.</text><text x="280" y="940" font-size="17">Version 1.0 · Guide revision 15 · Static design illustration, not a browser screenshot</text><text x="280" y="978" font-size="17">Prototype changes stay in page memory. Reloading discards them. No authentication or API call occurs.</text></g></svg>