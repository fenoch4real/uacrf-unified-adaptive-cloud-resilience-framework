spring.application.name=uacrf-knowledge
server.port=8090
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${KNOWLEDGE_JDBC_URL:jdbc:postgresql://localhost:55439/uacrf_knowledge}
spring.datasource.username=${KNOWLEDGE_DB_USER:uacrf_knowledge_app}
spring.datasource.password=${KNOWLEDGE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.delegation.audience=S08
uacrf.knowledge.case-receipts.enabled=${UACRF_KNOWLEDGE_CASE_RECEIPTS_ENABLED:false}
uacrf.knowledge.case-receipts.token-url=${UACRF_KNOWLEDGE_CASE_RECEIPTS_TOKEN_URL:http://localhost:8180/realms/uacrf/protocol/openid-connect/token}
uacrf.knowledge.case-receipts.client-id=${UACRF_KNOWLEDGE_CASE_RECEIPTS_CLIENT_ID:uacrf-s08-retriever}
uacrf.knowledge.case-receipts.client-secret=${UACRF_KNOWLEDGE_CASE_RECEIPTS_CLIENT_SECRET:}
uacrf.knowledge.case-receipts.delegation-url=${UACRF_KNOWLEDGE_CASE_RECEIPTS_DELEGATION_URL:http://localhost:8082/internal/v1/delegations}
uacrf.knowledge.case-receipts.assessment-base-url=${UACRF_KNOWLEDGE_CASE_RECEIPTS_ASSESSMENT_BASE_URL:http://localhost:8089}
