spring.application.name=uacrf-assessment
server.port=8089
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${ASSESSMENT_JDBC_URL:jdbc:postgresql://localhost:55438/uacrf_assessment}
spring.datasource.username=${ASSESSMENT_DB_USER:uacrf_assessment_app}
spring.datasource.password=${ASSESSMENT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.delegation.audience=S07

uacrf.assessment.receipts.enabled=${UACRF_ASSESSMENT_RECEIPTS_ENABLED:false}
uacrf.assessment.receipts.token-url=${UACRF_ASSESSMENT_RECEIPTS_TOKEN_URL:http://localhost:8180/realms/uacrf/protocol/openid-connect/token}
uacrf.assessment.receipts.client-id=${UACRF_ASSESSMENT_RECEIPTS_CLIENT_ID:uacrf-s07-evaluator}
uacrf.assessment.receipts.client-secret=${UACRF_ASSESSMENT_RECEIPTS_CLIENT_SECRET:}
uacrf.assessment.receipts.delegation-url=${UACRF_ASSESSMENT_RECEIPTS_DELEGATION_URL:http://localhost:8082/internal/v1/delegations}
uacrf.assessment.receipts.evidence-base-url=${UACRF_ASSESSMENT_RECEIPTS_EVIDENCE_BASE_URL:http://localhost:8086}
uacrf.assessment.receipts.objectives-base-url=${UACRF_ASSESSMENT_RECEIPTS_OBJECTIVES_BASE_URL:http://localhost:8087}
uacrf.assessment.receipts.topology-base-url=${UACRF_ASSESSMENT_RECEIPTS_TOPOLOGY_BASE_URL:http://localhost:8088}
