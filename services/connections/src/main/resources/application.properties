spring.application.name=uacrf-connections
server.port=8085
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${CONNECTIONS_JDBC_URL:jdbc:postgresql://localhost:55434/uacrf_connections}
spring.datasource.username=${CONNECTIONS_DB_USER:uacrf_connections_app}
spring.datasource.password=${CONNECTIONS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.delegation.audience=S03
uacrf.outbox.publisher.enabled=${UACRF_OUTBOX_PUBLISHER_ENABLED:false}
uacrf.outbox.publisher.interval-ms=${UACRF_OUTBOX_PUBLISHER_INTERVAL_MS:5000}
uacrf.outbox.publisher.token-url=${UACRF_S03_IDENTITY_TOKEN_URL:http://localhost:8180/realms/uacrf/protocol/openid-connect/token}
uacrf.outbox.publisher.client-id=${UACRF_S03_CLIENT_ID:uacrf-s03-publisher}
uacrf.outbox.publisher.client-secret=${UACRF_S03_CLIENT_SECRET:}
uacrf.outbox.publisher.delegation-url=${UACRF_S03_S01_DELEGATION_URL:http://localhost:8082/internal/v1/delegations}
uacrf.outbox.publisher.inbox-url=${UACRF_S03_S04_INBOX_URL:http://localhost:8086/internal/v1/inbox/events}
