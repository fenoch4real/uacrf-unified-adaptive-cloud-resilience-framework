spring.application.name=uacrf-identity
server.port=8082
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.datasource.url=${IDENTITY_JDBC_URL:jdbc:postgresql://localhost:55432/uacrf_identity}
spring.datasource.username=${IDENTITY_DB_USER:uacrf_identity_app}
spring.datasource.password=${IDENTITY_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.identity.oidc.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/uacrf}
uacrf.identity.oidc.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/uacrf/protocol/openid-connect/certs}
uacrf.identity.oidc.audience=${KEYCLOAK_S01_AUDIENCE:uacrf-s01}
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.private-key-base64=${UACRF_DELEGATION_PRIVATE_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.identity.bootstrap.enabled=${IDENTITY_BOOTSTRAP_ENABLED:false}
uacrf.identity.bootstrap.provider-id=${IDENTITY_BOOTSTRAP_PROVIDER_ID:}
uacrf.identity.bootstrap.provider-name=${IDENTITY_BOOTSTRAP_PROVIDER_NAME:}
uacrf.identity.bootstrap.issuer=${IDENTITY_BOOTSTRAP_ISSUER:}
uacrf.identity.bootstrap.tenant-id=${IDENTITY_BOOTSTRAP_TENANT_ID:}
uacrf.identity.bootstrap.tenant-name=${IDENTITY_BOOTSTRAP_TENANT_NAME:}
uacrf.identity.bootstrap.environment-id=${IDENTITY_BOOTSTRAP_ENVIRONMENT_ID:}
uacrf.identity.bootstrap.environment-name=${IDENTITY_BOOTSTRAP_ENVIRONMENT_NAME:}
uacrf.identity.bootstrap.principal-id=${IDENTITY_BOOTSTRAP_PRINCIPAL_ID:}
uacrf.identity.bootstrap.subject=${IDENTITY_BOOTSTRAP_SUBJECT:}
uacrf.identity.bootstrap.display-name=${IDENTITY_BOOTSTRAP_DISPLAY_NAME:}
uacrf.identity.bootstrap.admin-expires-at=${IDENTITY_BOOTSTRAP_ADMIN_EXPIRES_AT:}
uacrf.identity.bootstrap.reason=${IDENTITY_BOOTSTRAP_REASON:}
uacrf.identity.bootstrap.approver-principal-id=${IDENTITY_BOOTSTRAP_APPROVER_PRINCIPAL_ID:}
uacrf.identity.bootstrap.approver-subject=${IDENTITY_BOOTSTRAP_APPROVER_SUBJECT:}
uacrf.identity.bootstrap.approver-display-name=${IDENTITY_BOOTSTRAP_APPROVER_DISPLAY_NAME:}
uacrf.identity.directory.keycloak.enabled=${IDENTITY_DIRECTORY_ENABLED:false}
uacrf.identity.directory.keycloak.issuer=${IDENTITY_DIRECTORY_ISSUER:}
uacrf.identity.directory.keycloak.token-uri=${IDENTITY_DIRECTORY_TOKEN_URI:}
uacrf.identity.directory.keycloak.users-uri=${IDENTITY_DIRECTORY_USERS_URI:}
uacrf.identity.directory.keycloak.client-id=${IDENTITY_DIRECTORY_CLIENT_ID:}
uacrf.identity.directory.keycloak.client-secret=${IDENTITY_DIRECTORY_CLIENT_SECRET:}
