spring.application.name=uacrf-decision-governance
server.port=8091
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${DECISION_GOVERNANCE_JDBC_URL:jdbc:postgresql://localhost:55443/uacrf_decision_governance}
spring.datasource.username=${DECISION_GOVERNANCE_DB_USER:uacrf_decision_governance_app}
spring.datasource.password=${DECISION_GOVERNANCE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.delegation.audience=S10
# Strict reviewer public-key trust set JSON (see services/decision-governance/README.md); unset disables approvals.
uacrf.policy-trust.set-json=${UACRF_POLICY_TRUST_SET_JSON:}
