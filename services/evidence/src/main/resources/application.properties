spring.application.name=uacrf-evidence
server.port=8086
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${EVIDENCE_JDBC_URL:jdbc:postgresql://localhost:55435/uacrf_evidence}
spring.datasource.username=${EVIDENCE_DB_USER:uacrf_evidence_app}
spring.datasource.password=${EVIDENCE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.delegation.audience=S04
