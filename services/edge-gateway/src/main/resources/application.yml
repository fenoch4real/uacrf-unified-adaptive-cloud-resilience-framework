server:
  port: 8080

spring:
  application:
    name: edge-gateway

uacrf:
  edge:
    identity-base-url: ${UACRF_IDENTITY_URL:http://localhost:8082}
    catalog-base-url: ${UACRF_CATALOG_URL:http://localhost:8083}
    discovery-base-url: ${UACRF_DISCOVERY_URL:http://localhost:8084}
    evidence-base-url: ${UACRF_EVIDENCE_URL:http://localhost:8085}
    graph-base-url: ${UACRF_GRAPH_URL:http://localhost:8086}
    assessment-base-url: ${UACRF_ASSESSMENT_URL:http://localhost:8087}
    objectives-base-url: ${UACRF_OBJECTIVES_URL:http://localhost:8088}
    policy-base-url: ${UACRF_POLICY_URL:http://localhost:8089}
    recovery-base-url: ${UACRF_RECOVERY_URL:http://localhost:8090}
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
