server:
  port: 8091

spring:
  application:
    name: knowledge-service
  datasource:
    url: ${UACRF_KNOWLEDGE_DB_URL:jdbc:postgresql://localhost:5432/uacrf_knowledge}
    username: ${UACRF_DB_USER:uacrf}
    password: ${UACRF_DB_PASSWORD:uacrf}
  flyway:
    schemas: knowledge,integration
    default-schema: knowledge

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
