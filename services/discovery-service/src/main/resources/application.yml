server:
  port: 8084

spring:
  application:
    name: discovery-service
  datasource:
    url: ${UACRF_DISCOVERY_DB_URL:jdbc:postgresql://localhost:5432/uacrf_discovery}
    username: ${UACRF_DB_USER:uacrf}
    password: ${UACRF_DB_PASSWORD:uacrf}
  flyway:
    schemas: discovery,integration
    default-schema: discovery

uacrf:
  discovery:
    evidence-base-url: ${UACRF_EVIDENCE_URL:http://localhost:8085}
    graph-base-url: ${UACRF_GRAPH_URL:http://localhost:8086}
    catalog-base-url: ${UACRF_CATALOG_URL:http://localhost:8083}
    forward-downstream: ${UACRF_DISCOVERY_FORWARD:false}
    adapters:
      aws:
        enabled: ${UACRF_DISCOVERY_AWS_ENABLED:false}
        region: ${UACRF_DISCOVERY_AWS_REGION:us-east-1}
        auth-mode: ${UACRF_DISCOVERY_AWS_AUTH_MODE:IAM_ASSUME_ROLE}
        access-key-id: ${UACRF_DISCOVERY_AWS_ACCESS_KEY_ID:}
        secret-access-key: ${UACRF_DISCOVERY_AWS_SECRET_ACCESS_KEY:}
        session-token: ${UACRF_DISCOVERY_AWS_SESSION_TOKEN:}
        credentials-file: ${UACRF_DISCOVERY_AWS_CREDENTIALS_FILE:}
        profile: ${UACRF_DISCOVERY_AWS_PROFILE:default}
        role-arn: ${UACRF_DISCOVERY_AWS_ROLE_ARN:}
        external-id: ${UACRF_DISCOVERY_AWS_EXTERNAL_ID:}
        sts-url: ${UACRF_DISCOVERY_AWS_STS_URL:}
        cloudwatch-url: ${UACRF_DISCOVERY_AWS_CLOUDWATCH_URL:}
        logs-url: ${UACRF_DISCOVERY_AWS_LOGS_URL:}
        endpoint-url: ${UACRF_DISCOVERY_AWS_ENDPOINT:}
        bearer-token: ${UACRF_DISCOVERY_AWS_TOKEN:}
      gcp:
        enabled: ${UACRF_DISCOVERY_GCP_ENABLED:false}
        project-id: ${UACRF_DISCOVERY_GCP_PROJECT:uacrf-unconfigured}
        auth-mode: ${UACRF_DISCOVERY_GCP_AUTH_MODE:WORKLOAD_IDENTITY}
        credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:}
        oauth-token-url: ${UACRF_DISCOVERY_GCP_TOKEN_URL:https://oauth2.googleapis.com/token}
        monitoring-url: ${UACRF_DISCOVERY_GCP_MONITORING_URL:https://monitoring.googleapis.com}
        logging-url: ${UACRF_DISCOVERY_GCP_LOGGING_URL:https://logging.googleapis.com}
        endpoint-url: ${UACRF_DISCOVERY_GCP_ENDPOINT:}
        bearer-token: ${UACRF_DISCOVERY_GCP_TOKEN:}
      azure:
        enabled: ${UACRF_DISCOVERY_AZURE_ENABLED:false}
        subscription-id: ${UACRF_DISCOVERY_AZURE_SUB:unconfigured}
        auth-mode: ${UACRF_DISCOVERY_AZURE_AUTH_MODE:MANAGED_IDENTITY}
        endpoint-url: ${UACRF_DISCOVERY_AZURE_ENDPOINT:}
        bearer-token: ${UACRF_DISCOVERY_AZURE_TOKEN:}
      oci:
        enabled: ${UACRF_DISCOVERY_OCI_ENABLED:false}
        tenancy-ocid: ${UACRF_DISCOVERY_OCI_TENANCY:unconfigured}
        region: ${UACRF_DISCOVERY_OCI_REGION:us-ashburn-1}
        auth-mode: ${UACRF_DISCOVERY_OCI_AUTH_MODE:INSTANCE_PRINCIPAL}
        endpoint-url: ${UACRF_DISCOVERY_OCI_ENDPOINT:}
        bearer-token: ${UACRF_DISCOVERY_OCI_TOKEN:}
      otel:
        enabled: ${UACRF_DISCOVERY_OTEL_ENABLED:true}
        endpoint: ${UACRF_DISCOVERY_OTEL_ENDPOINT:http://otel-collector:4318}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
