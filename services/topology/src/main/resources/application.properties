spring.application.name=uacrf-topology
server.port=8088
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${TOPOLOGY_JDBC_URL:jdbc:postgresql://localhost:55437/uacrf_topology}
spring.datasource.username=${TOPOLOGY_DB_USER:uacrf_topology_app}
spring.datasource.password=${TOPOLOGY_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
uacrf.delegation.public-key-base64=${UACRF_DELEGATION_PUBLIC_KEY_BASE64}
uacrf.delegation.key-id=${UACRF_DELEGATION_KEY_ID}
uacrf.delegation.issuer=${UACRF_DELEGATION_ISSUER:https://uacrf.local/s01}
uacrf.delegation.audience=S06

uacrf.topology.neo4j.uri=${TOPOLOGY_NEO4J_URI:bolt://localhost:55687}
uacrf.topology.neo4j.user=${TOPOLOGY_NEO4J_USER:neo4j}
uacrf.topology.neo4j.password=${TOPOLOGY_NEO4J_PASSWORD:topology-local-password}
uacrf.topology.projection.enabled=${UACRF_TOPOLOGY_PROJECTION_ENABLED:false}
uacrf.topology.projection.interval-ms=${UACRF_TOPOLOGY_PROJECTION_INTERVAL_MS:5000}
uacrf.topology.projection.lease-ms=${UACRF_TOPOLOGY_PROJECTION_LEASE_MS:60000}
uacrf.topology.projection.retry-base-ms=${UACRF_TOPOLOGY_PROJECTION_RETRY_BASE_MS:1000}
uacrf.topology.projection.batch-size=${UACRF_TOPOLOGY_PROJECTION_BATCH_SIZE:10}
uacrf.topology.neo4j.connection-timeout-ms=${TOPOLOGY_NEO4J_CONNECTION_TIMEOUT_MS:5000}
uacrf.topology.neo4j.max-transaction-retry-ms=${TOPOLOGY_NEO4J_RETRY_TIMEOUT_MS:5000}

uacrf.topology.identity-url=${UACRF_TOPOLOGY_IDENTITY_URL:http://localhost:8082}
uacrf.topology.catalog-url=${UACRF_TOPOLOGY_CATALOG_URL:http://localhost:8083}
uacrf.topology.evidence-url=${UACRF_TOPOLOGY_EVIDENCE_URL:http://localhost:8086}
uacrf.topology.assessment-url=${UACRF_TOPOLOGY_ASSESSMENT_URL:http://localhost:8089}
uacrf.topology.s02-key-id=${UACRF_TOPOLOGY_S02_KEY_ID:}
uacrf.topology.s02-public-key-base64=${UACRF_TOPOLOGY_S02_PUBLIC_KEY_BASE64:}
uacrf.topology.commands.interval-ms=${UACRF_TOPOLOGY_COMMAND_INTERVAL_MS:1000}
uacrf.topology.commands.lease-ms=${UACRF_TOPOLOGY_COMMAND_LEASE_MS:30000}
uacrf.topology.commands.batch-size=${UACRF_TOPOLOGY_COMMAND_BATCH_SIZE:10}
