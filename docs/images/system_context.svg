<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="UACRF service architecture"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45617d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#152b43">
<text x="35" y="44" font-size="28" font-weight="700">UACRF service architecture</text>
<rect x="35" y="78" width="440" height="105" rx="10" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="50" y="106" font-size="20" fill="#152b43">One browser application</text>
<text x="50" y="135" font-size="18" fill="#152b43">UX01 behind the edge composes domain APIs.</text>
<rect x="525" y="78" width="440" height="105" rx="10" fill="#e8f2ff" stroke="#bbcad9"/>
<text x="540" y="106" font-size="20" fill="#152b43">One public API edge</text>
<text x="540" y="135" font-size="18" fill="#152b43">EDGE01 accepts browser and API transport.</text>
<path d="M525,130 L477,130" fill="none" stroke="#45617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="223" font-size="22" fill="#152b43">Fourteen domain services with exclusive data ownership</text>
