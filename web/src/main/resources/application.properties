spring.application.name=uacrf-web
server.port=8084
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${UACRF_SESSION_COOKIE_SECURE:false}
uacrf.web.oidc.issuer-uri=${UACRF_OIDC_ISSUER_URI:http://localhost:8180/realms/uacrf}
uacrf.web.oidc.client-id=${UACRF_OIDC_CLIENT_ID:uacrf-ux01}
uacrf.web.oidc.authorization-uri=${UACRF_OIDC_AUTHORIZATION_URI:}
uacrf.web.oidc.token-uri=${UACRF_OIDC_TOKEN_URI:}
uacrf.web.oidc.jwk-set-uri=${UACRF_OIDC_JWK_SET_URI:}
uacrf.web.oidc.userinfo-uri=${UACRF_OIDC_USERINFO_URI:}
uacrf.web.experience.base-url=${UACRF_EXPERIENCE_BASE_URL:http://localhost:8081}
uacrf.web.catalog.base-url=${UACRF_CATALOG_BASE_URL:http://localhost:8080/internal/catalog}
