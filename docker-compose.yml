services:
  postgres:
    image: postgres:17-alpine
    container_name: uacrf-postgres
    environment:
      POSTGRES_USER: uacrf_admin
      POSTGRES_PASSWORD: uacrf_dev_password
      POSTGRES_DB: uacrf
    ports:
      - "5432:5432"
    volumes:
      - uacrf_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uacrf_admin -d uacrf"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: uacrf-neo4j
    environment:
      NEO4J_AUTH: neo4j/uacrf_neo4j_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - uacrf_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p uacrf_neo4j_dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j-init:
    image: neo4j:5.26-community
    container_name: uacrf-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./contracts/neo4j/01_constraints_and_indexes.cypher:/init/01_constraints.cypher:ro
    entrypoint: >
      /bin/sh -c "
      cypher-shell -a bolt://neo4j:7687 -u neo4j -p uacrf_neo4j_dev -f /init/01_constraints.cypher &&
      exit 0
      "

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: uacrf-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: localstack/localstack:3.8
    container_name: uacrf-s3-worm
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "9000:4566"
    volumes:
      - uacrf_minio_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: amazon/aws-cli:2.22.0
    container_name: uacrf-s3-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: uacrf_minio
      AWS_SECRET_ACCESS_KEY: uacrf_minio_dev_secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://minio:4566 s3api create-bucket --bucket uacrf-evidence --object-lock-enabled-for-bucket || true &&
      aws --endpoint-url=http://minio:4566 s3api create-bucket --bucket uacrf-knowledge || true &&
      exit 0
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: uacrf-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/uacrf-realm.json:/opt/keycloak/data/import/uacrf-realm.json:ro

  opa:
    image: openpolicyagent/opa:1.0.0
    container_name: uacrf-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: uacrf-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: uacrf_admin
      POSTGRES_PWD: uacrf_dev_password
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: uacrf-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

volumes:
  uacrf_pg_data:
  uacrf_neo4j_data:
  uacrf_minio_data:
