openapi: 3.1.0
info:
  title: UACRF S01 Identity & Delegation API
  version: 1.0.0
paths:
  /v1/principals:
    get:
      summary: List admitted principals in tenant and environment scope
      responses:
        "200": { description: List of principals }
    post:
      summary: Admit a directory principal (grants zero memberships)
      responses:
        "201": { description: Principal admitted with runtimeEffect=NONE }
  /v1/owner-candidates:
    get:
      summary: List enabled HUMAN principals holding active owner.eligible
      responses:
        "200": { description: Eligible owners }
  /v1/grants/decisions:
    post:
      summary: Record an independent approval/rejection decision
      responses:
        "201": { description: Grant decision recorded }
        "403": { description: Self-approval or non-human approver rejected }
  /v1/memberships:
    get:
      summary: List memberships in tenant/environment scope
      responses:
        "200": { description: Membership list }
    post:
      summary: Consume a grant decision and issue a bounded membership
      responses:
        "201": { description: Membership granted }
        "403": { description: Separation of duties violated }
        "409": { description: Grant decision consumed or expired }
  /v1/delegations/exchange:
    post:
      summary: Internal endpoint issuing 30s audience-bound RS256 delegation JWT
      responses:
        "200": { description: Delegation issued }
        "403": { description: Missing required capability }
