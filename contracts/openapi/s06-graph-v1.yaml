openapi: 3.1.0
info:
  title: UACRF S06 Knowledge Graph Projection & Query API
  version: 1.0.0
paths:
  /v1/graph/revisions/current:
    get:
      summary: Get latest immutable graph revision digest
      responses:
        '200': { description: Current graph revision }
  /v1/graph/dependencies:
    get:
      summary: Bounded BFS dependency graph traversal around focus node
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: environmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: focusCanonicalId
          in: query
          required: false
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 3, default: 2 }
        - name: includeUncertain
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200': { description: Nodes, edges, revisionDigest, and nonCausationNotice }
  /v1/graph/ai-lineage:
    get:
      summary: Get AI workload dependency lineage subgraph
      responses:
        '200': { description: AI endpoint, model, feature store, and fallback graph }
  /v1/graph/project-edges:
    post:
      summary: Ontology-checked Neo4j projection batch
      responses:
        '200': { description: Published GraphRevision }
        '422': { description: Ontology violation outside canonical 58 labels or 55 relationships }
  /v1/graph/edges/{edgeId}/confirm:
    post:
      summary: Owner confirmation promoting an edge to CONFIRMED
      responses:
        '200': { description: Edge confirmed }
