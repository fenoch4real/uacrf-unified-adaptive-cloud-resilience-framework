openapi: 3.1.0
info:
  title: UACRF S03 Discovery & Telemetry Adapter API
  version: 1.0.0
paths:
  /v1/connections:
    get:
      summary: List configured telemetry and cloud inventory connections
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: environmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: List of connections }
    post:
      summary: Register a new cloud or telemetry connection
      responses:
        '201': { description: Connection created }
  /v1/telemetry/events:
    get:
      summary: List normalized telemetry observations
      responses:
        '200': { description: Recent observations }
    post:
      summary: Ingest a normalized telemetry event
      responses:
        '202': { description: Observation accepted and written to outbox }
  /v1/telemetry/sample-scenario:
    post:
      summary: Load illustrative SAMPLE_LOCAL multi-cloud and AI lineage scenario fixture
      responses:
        '201': { description: Sample scenario loaded with provenanceClass=SAMPLE_ONLY }
  /v1/discovery/edges:
    get:
      summary: List discovered dependency edges
      responses:
        '200': { description: List of discovered edges }
  /v1/inventory/profiles:
    get:
      summary: List read-only multi-cloud inventory poller profiles (AWS, GCP, Azure, OCI)
      responses:
        '200': { description: List of cloud inventory adapter profiles and auth modes }
  /v1/inventory/resource-families:
    get:
      summary: List the 20 canonical multi-cloud infrastructure & AI resource families
      responses:
        '200': { description: Multi-cloud resource family catalog }
  /v1/inventory/normalize:
    post:
      summary: Normalize raw cloud inventory assets into canonical observations, Neo4j-validated edges, compute placement & aliases
      responses:
        '200': { description: Normalized cloud catalog batch }
  /v1/inventory/poll:
    post:
      summary: Poll live read-only cloud inventory API when enabled=true and read-only credentials are configured
      responses:
        '200': { description: Live cloud inventory batch normalized and persisted }
        '412': { description: Fail-closed when adapter enabled=false or read-only credentials missing }
